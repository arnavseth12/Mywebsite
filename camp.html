<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arnav Seth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <section id="home">
    <div class="leaf-field" id="leaf-field"></div>

    <div class="hero">
      <h1 class="hero-name">Arnav Seth</h1>
      <p class="hero-tagline">
        <span id="typed-text"></span><span class="cursor">|</span>
      </p>

      <div class="social-icons">
        <a href="https://github.com/arnavseth12" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://linkedin.com/in/YOUR_USERNAME" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="mailto:you@example.com" aria-label="Email">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </div>

      <button id="explore-btn">🌲 Explore Forest</button>
    </div>
  </section>

  <section id="map" class="hidden">
    <button id="back-btn">« Back to camp</button>
    <h2 class="map-heading">Choose Your Path</h2>

    <div class="map-stage">
      <span class="deco-tree" style="left:6%; top:8%;">🌲</span>
      <span class="deco-tree" style="left:94%; top:10%;">🌳</span>
      <span class="deco-tree" style="left:8%; top:92%;">🌳</span>
      <span class="deco-tree small" style="left:50%; top:5%;">🌿</span>
      
<svg class="path-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <path class="trail-edge" d="M 500 780 C 400 700 280 650 220 550"></path>
  <path class="trail-edge" d="M 500 780 C 300 650 100 450 180 250"></path>
  <path class="trail-edge" d="M 500 780 C 480 550 250 300 400 150"></path>
  <path class="trail-edge" d="M 500 780 C 520 550 750 300 620 150"></path>
  <path class="trail-edge" d="M 500 780 C 700 650 900 450 820 250"></path>
  <path class="trail-edge" d="M 500 780 C 600 700 720 650 780 550"></path>

  <path class="trail-core" d="M 500 780 C 400 700 280 650 220 550"></path>
  <path class="trail-core" d="M 500 780 C 300 650 100 450 180 250"></path>
  <path class="trail-core" d="M 500 780 C 480 550 250 300 400 150"></path>
  <path class="trail-core" d="M 500 780 C 520 550 750 300 620 150"></path>
  <path class="trail-core" d="M 500 780 C 700 650 900 450 820 250"></path>
  <path class="trail-core" d="M 500 780 C 600 700 720 650 780 550"></path>
</svg>

      <button id="easter-trigger" aria-label="???">🍃</button>

      <div id="game-modal" class="hidden">
        <div class="game-box">
          <button id="game-close" aria-label="Close">✕</button>
          <h2>Firefly Catch</h2>
          <p id="game-status">Click fireflies before they vanish. 15 seconds</p>
          <div id="game-arena">
            <span id="game-score">Score: 0</span>
            <span id="game-timer">Time: 15</span>
            </div>
            <button id="game-start">Start</button>
          </div>
        </div>

      <button class="node" data-page="home" style="left:50%; top:78%;">
        <span class="badge">🏕️</span>
        <span class="label">CAMP</span>
      </button>
      <button class="node" data-page="about" style="left:22%; top:55%;">
        <span class="badge">⛺</span>
        <span class="label">ABOUT ME</span>
      </button>
      <button class="node" data-page="projects" style="left:18%; top:25%;">
        <span class="badge">🗻</span>
        <span class="label">PROJECTS</span>
      </button>
      <button class="node" data-page="achievements" style="left:40%; top:15%;">
        <span class="badge">🏆</span>
        <span class="label">ACHIEVEMENTS</span>
      </button>
      <button class="node" data-page="services" style="left:62%; top:15%;">
        <span class="badge">🧰</span>
        <span class="label">SERVICES</span>
      </button>
      <button class="node" data-page="resume" style="left:82%; top:25%;">
        <span class="badge">📄</span>
        <span class="label">RESUME</span>
      </button>
      <button class="node" data-page="contact" style="left:78%; top:55%;">
        <span class="badge">✉️</span>
        <span class="label">CONTACT</span>
      </button>
    </div>
  </section>
</body>
</html>
